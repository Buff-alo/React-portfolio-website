server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip Compression (Speeds up loading text-based assets)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 2. General Routing (SPA Support)
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so updates are seen immediately
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 3. Static Assets (Vite puts hashed files in /assets)
    # Cache these for 1 year because their names change when content changes
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options "SAMEORIGIN";
}