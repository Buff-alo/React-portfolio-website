variables:
  IMAGE_NAME: buffalo147/dev-apps
  IMAGE_TAG: portfolio-web

stages:
  - build
  - deploy

build:
  stage: build
  image: docker:25.0.3-git
  services:
    - name: docker:25.0.3-dind
      alias: docker
      command: ["--experimental"]

  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    BUILDKIT_INLINE_CACHE: 1
    BUILDKIT_PROGRESS: plain
    DOCKER_BUILDKIT: 1

  before_script:
    - echo "Logging in to Docker registry..."
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin docker.io

    # 1. Install QEMU for multi-platform support
    - docker run --privileged --rm tonistiigi/binfmt --install all

    # 2. Use 'docker context create' explicitly to define the DIND environment.
    # We must explicitly define the context to give buildx the TLS info it needs.
    - docker context create buildx-dind --docker "host=$DOCKER_HOST,ca=/certs/client/ca.pem,cert=/certs/client/cert.pem,key=/certs/client/key.pem"
    - docker context use buildx-dind

    # 3. Create a NEW builder instance using the new context and container driver
    - docker buildx create --use --name mybuilder --driver docker-container || true
    - docker buildx inspect --bootstrap mybuilder
    # We use 'mybuilder' from here on, which has the correct driver.

  script:
    - echo "Building multi-architecture Docker image for linux/amd64 and linux/arm64..."

    # FIX: Use single line command to avoid syntax error
    # Use the 'mybuilder' instance we created
    - docker buildx build --builder mybuilder --tag $IMAGE_NAME:$IMAGE_TAG --platform linux/amd64,linux/arm64 --push -f docker/Dockerfile .

    - echo "Successfully pushed multi-architecture manifest to registry."

