variables:
  IMAGE_NAME: buffalo147/dev-apps
  IMAGE_TAG: portfolio-web

stages:
  - build
  - deploy

build:
  stage: build
  image: docker:25.0.3-git
  services:
    - name: docker:25.0.3-dind
      alias: docker

  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    BUILDKIT_INLINE_CACHE: 1
    BUILDKIT_PROGRESS: plain
    DOCKER_BUILDKIT: 1

  before_script:
    - echo "Logging in to Docker registry..."
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin docker.io

    # Install QEMU for multi-platform support
    - docker run --privileged --rm tonistiigi/binfmt --install all

    # Wait for Docker daemon to be ready
    - timeout 30 sh -c 'until docker info >/dev/null 2>&1; do echo "Waiting for Docker daemon..."; sleep 1; done'

    # Create buildx builder with simple approach
    - docker buildx version
    - docker buildx create --name mybuilder --use --bootstrap
    - docker buildx inspect --bootstrap

  script:
    - echo "Building multi-architecture Docker image for linux/amd64 and linux/arm64..."
    - |
      docker buildx build \
        --tag $IMAGE_NAME:$IMAGE_TAG \
        --platform linux/amd64,linux/arm64 \
        --push \
        -f docker/Dockerfile .
    - echo "Successfully pushed multi-architecture manifest to registry."

deploy:
  stage: deploy
  tags:
    - deploy
    - kls
  image:
    name: alpine:latest
    entrypoint: [""]
  variables:
    IMAGE: "$IMAGE_NAME:$IMAGE_TAG"
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    # Create kubeconfig file from env var
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - kubectl version
    - |
      kubectl create secret docker-registry docker-registry-secret \
        --docker-server=docker.io \
        --docker-username=$REGISTRY_USER \
        --docker-password=$REGISTRY_PASS \
        --dry-run=client -o yaml | kubectl apply -f -
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml
    - kubectl apply -f k8s/