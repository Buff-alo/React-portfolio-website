variables:
  IMAGE_NAME: buffalo147/dev-apps
  IMAGE_TAG: portfolio-web

stages:
  - build
  - deploy
build:
  stage: build
  image: 
    name: gcr.io/kaniko-project/executor:latest
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"docker.io\":{\"auth\":\"$(echo -n "$REGISTRY_USER:$REGISTRY_PASS" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      # Build for both architectures
      for arch in amd64 arm64; do
        /kaniko/executor \
          --context "${CI_PROJECT_DIR}" \
          --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile" \
          --destination "${IMAGE_NAME}:${IMAGE_TAG}-${arch}" \
          --custom-platform "linux/${arch}" \
          --cache=true \
          --cache-repo="${IMAGE_NAME}/cache"
      done
      
    # Install docker CLI for manifest creation
    - |
      apk add --no-cache docker-cli
      docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASS" docker.io
      
      docker manifest create \
        $IMAGE_NAME:$IMAGE_TAG \
        $IMAGE_NAME:${IMAGE_TAG}-amd64 \
        $IMAGE_NAME:${IMAGE_TAG}-arm64
      
      docker manifest push $IMAGE_NAME:$IMAGE_TAG

deploy:
  stage: deploy
  tags:
    - deploy
    - kls
  image:
    name: alpine:latest
    entrypoint: [""]
  variables:
    IMAGE: "$IMAGE_NAME:$IMAGE_TAG"
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - kubectl version
    - |
      kubectl create secret docker-registry docker-registry-secret \
        --docker-server=docker.io \
        --docker-username=$REGISTRY_USER \
        --docker-password=$REGISTRY_PASS \
        --dry-run=client -o yaml | kubectl apply -f -
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml
    - kubectl apply -f k8s/