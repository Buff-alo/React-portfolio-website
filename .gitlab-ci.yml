variables:
  IMAGE_NAME: buffalo147/dev-apps
  IMAGE_TAG: portfolio-web

stages:
  - build
  - deploy

.build_template: &build_template
  stage: build
  image: 
    name: gcr.io/kaniko-project/executor:latest
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"docker.io\":{\"auth\":\"$(echo -n "$REGISTRY_USER:$REGISTRY_PASS" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json

build_amd64:
  <<: *build_template
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile" \
        --destination "${IMAGE_NAME}:${IMAGE_TAG}-amd64" \
        --custom-platform "linux/amd64" \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache" \
        --cache-copy-layers \
        --cache-run-layers

build_arm64:
  <<: *build_template
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/docker/Dockerfile" \
        --destination "${IMAGE_NAME}:${IMAGE_TAG}-arm64" \
        --custom-platform "linux/arm64" \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache" \
        --cache-copy-layers \
        --cache-run-layers

create_manifest:
  stage: build
  image: docker:25.0.3-git
  needs: ["build_amd64", "build_arm64"]
  before_script:
    - echo "$REGISTRY_PASS" | docker login -u "$REGISTRY_USER" --password-stdin docker.io
  script:
    - |
      # Create and push manifest list
      docker manifest create \
        $IMAGE_NAME:$IMAGE_TAG \
        $IMAGE_NAME:${IMAGE_TAG}-amd64 \
        $IMAGE_NAME:${IMAGE_TAG}-arm64
      
      # Annotate each architecture
      docker manifest annotate \
        $IMAGE_NAME:$IMAGE_TAG \
        $IMAGE_NAME:${IMAGE_TAG}-amd64 \
        --arch amd64 --os linux
      
      docker manifest annotate \
        $IMAGE_NAME:$IMAGE_TAG \
        $IMAGE_NAME:${IMAGE_TAG}-arm64 \
        --arch arm64 --os linux
      
      # Push the manifest
      docker manifest push $IMAGE_NAME:$IMAGE_TAG
      
      # Clean up individual arch images (optional)
      docker rmi $IMAGE_NAME:${IMAGE_TAG}-amd64 $IMAGE_NAME:${IMAGE_TAG}-arm64 || true

deploy:
  stage: deploy
  tags:
    - deploy
    - kls
  image:
    name: alpine:latest
    entrypoint: [""]
  variables:
    IMAGE: "$IMAGE_NAME:$IMAGE_TAG"
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - echo "$KUBE_CONFIG" | base64 -d > kubeconfig
    - export KUBECONFIG=$PWD/kubeconfig
    - kubectl version
    - |
      kubectl create secret docker-registry docker-registry-secret \
        --docker-server=docker.io \
        --docker-username=$REGISTRY_USER \
        --docker-password=$REGISTRY_PASS \
        --dry-run=client -o yaml | kubectl apply -f -
    - sed -i "s|IMAGE_PLACEHOLDER|$IMAGE|g" k8s/deployment.yaml
    - kubectl apply -f k8s/