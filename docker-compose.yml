services:
  portfolio-web:
    image: $IMAGE_NAME:$IMAGE_TAG
    container_name: react-portfolio-web
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`www.kwadwolabs.cloud`) || Host(`kwadwolabs.cloud`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
    networks:
      - traefik_net

networks:
  traefik_net:
    external: true